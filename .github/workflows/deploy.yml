name: Deploy storefront demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storefront-api-demo-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VITE_SCALEV_API_BASE: https://api.scalev.com
      VITE_SCALEV_STORE_UNIQUE_ID: store_vlzpML8edzxO5roOdV7Oyfn6
      VITE_SCALEV_STOREFRONT_API_KEY: ${{ secrets.VITE_SCALEV_STOREFRONT_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=storefront-api-demo --branch=main
